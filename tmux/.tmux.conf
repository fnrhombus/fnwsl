# --- Prefix: Ctrl+a (easier than Ctrl+b) ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Mouse support ---
set -g mouse on

# --- True color support ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# --- Start windows/panes at 1, not 0 ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Sensible splits (| and -) ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- New windows keep current path ---
bind c new-window -c "#{pane_current_path}"

# --- Navigate panes with Alt+arrow (no prefix needed) ---
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# --- Resize panes with Ctrl+arrow ---
bind -r C-Left resize-pane -L 5
bind -r C-Right resize-pane -R 5
bind -r C-Up resize-pane -U 5
bind -r C-Down resize-pane -D 5

# --- History ---
set -g history-limit 50000

# --- No delay on escape (important for vim/zsh) ---
set -sg escape-time 0

# --- Status bar ---
set -g status-position bottom
set -g status-interval 5

# --- Reload config ---
bind r source-file ~/.tmux.conf \; display "Config reloaded"
