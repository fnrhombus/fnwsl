name: Sync dev to main

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Clean and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Remove unwanted files
          git rm -rf --ignore-unmatch CLAUDE.md .claude/
          git rm -rf --ignore-unmatch .claude

          # Strip co-authored-by lines mentioning AI assistants from recent commits
          # by squashing everything into a single commit on main
          TREE=$(git write-tree)

          # Get the current main tip (if it exists) as parent context,
          # but we'll just build a clean snapshot commit
          MAIN_TIP=$(git rev-parse origin/main 2>/dev/null || true)

          # Build a clean commit message from the dev branch
          # Collect subjects of commits on dev that aren't on main
          if [ -n "$MAIN_TIP" ]; then
            SUBJECTS=$(git log --format="%s" origin/main..HEAD | grep -iv 'claude\|anthropic' || true)
            # Use main tip as parent so history stays contiguous
            PARENT_FLAG="-p $MAIN_TIP"
          else
            SUBJECTS=$(git log --format="%s" HEAD | grep -iv 'claude\|anthropic' || true)
            PARENT_FLAG=""
          fi

          # Fallback message if everything was filtered
          if [ -z "$SUBJECTS" ]; then
            SUBJECTS="sync from dev"
          fi

          MSG=$(printf "sync from dev\n\n%s" "$SUBJECTS")

          # Create the commit object directly (bypasses any trailer issues)
          COMMIT=$(echo "$MSG" | git commit-tree $TREE $PARENT_FLAG)

          # Force-update main to this commit
          git push origin "$COMMIT:refs/heads/main" --force
