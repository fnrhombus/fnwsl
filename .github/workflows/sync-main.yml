name: Sync dev to main

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Clean and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Remove files that shouldn't be on main
          git rm -rf --ignore-unmatch CLAUDE.md .claude/
          git rm -rf --ignore-unmatch .claude

          # Commit the removal (if anything changed) and push
          if git diff --cached --quiet; then
            # Nothing to remove, fast-forward main to dev
            git push origin HEAD:refs/heads/main
          else
            git commit -m "sync from dev (clean)"
            git push origin HEAD:refs/heads/main
          fi
